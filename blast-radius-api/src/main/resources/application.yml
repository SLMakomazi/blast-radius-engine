spring:
  application:
    name: blast-radius-api
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      service: ${spring.application.name}
      environment: local
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  endpoint:
    health:
      show-details: never

# ---------------------------------------------------------------------------
# Runtime topology, lifecycle, telemetry and advisory AI configuration.
# Settings can be overridden
# through environment variables or profile-specific application-*.yml files.
# ---------------------------------------------------------------------------
blast-radius:
  topology:
    ttl: ${TOPOLOGY_TTL:7d}
    discovery-window: ${TOPOLOGY_DISCOVERY_WINDOW:5m}
    refresh-interval: ${TOPOLOGY_REFRESH_INTERVAL:30s}
    refresh-enabled: ${TOPOLOGY_REFRESH_ENABLED:true}
    application-id: ${MONITOR_APPLICATION_ID}
    environment: ${MONITOR_ENVIRONMENT:local}
  lifecycle:
    auto-recovery-enabled: true
    application-id: ${MONITOR_APPLICATION_ID}
    environment: ${MONITOR_ENVIRONMENT:local}
    max-evidence-per-incident: ${INCIDENT_MAX_EVIDENCE:20000}
    collection-duration: ${INCIDENT_COLLECTION_DURATION:7d}
    evaluation-interval: 10s
    initial-delay: 10s
    recovery-lookback: 20s
    healthy-windows-required: 3
  telemetry:
    loki:
      base-url: ${LOKI_BASE_URL:http://loki:3100}
      limit: 500
      timeout: 10s
      provider-id: local-loki

    prometheus:
      base-url: ${PROMETHEUS_BASE_URL:http://prometheus:9090}
      timeout: 10s
      provider-id: local-prometheus
      metric-selectors:
        - http_server_requests_seconds_count
        - http_server_requests_seconds_sum
        - http_server_requests_seconds_max
        - http_client_requests_seconds_count
        - http_client_requests_seconds_sum
        - hikaricp_connections_active
        - hikaricp_connections_pending
        - hikaricp_connections_timeout_total
        - jvm_memory_used_bytes
        - process_cpu_usage

    tempo:
      base-url: ${TEMPO_BASE_URL:http://tempo:3200}
      timeout: 10s
      provider-id: local-tempo
      search-limit: 20


  ai:
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:20}
