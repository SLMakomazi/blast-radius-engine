spring:
  application:
    name: blast-radius-api
  datasource:
    url: ${BLAST_RADIUS_DB_URL:jdbc:postgresql://blast-radius-db:5432/blast_radius}
    username: ${BLAST_RADIUS_DB_USER:blast_radius}
    password: ${BLAST_RADIUS_DB_PASSWORD:blast-radius-local-only}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      service: ${spring.application.name}
      environment: local
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  endpoint:
    health:
      show-details: never

# ---------------------------------------------------------------------------
# Phase 4 — Telemetry provider adapter configuration
# All values target the local Docker/Podman lab topology.
# Override via environment variables or a profile-specific application-*.yml.
# ---------------------------------------------------------------------------
blast-radius:
  topology:
    directory: ${TOPOLOGY_DIRECTORY:./data/topology}
    ttl: ${TOPOLOGY_TTL:7d}
    discovery-window: ${TOPOLOGY_DISCOVERY_WINDOW:5m}
    refresh-interval: ${TOPOLOGY_REFRESH_INTERVAL:30s}
    refresh-enabled: ${TOPOLOGY_REFRESH_ENABLED:true}
    application-id: ${TOPOLOGY_APPLICATION_ID:document-platform}
    environment: ${TOPOLOGY_ENVIRONMENT:local}
  telemetry:
    loki:
      base-url: ${LOKI_BASE_URL:http://loki:3100}
      limit: 500
      timeout: 10s
      provider-id: local-loki

    prometheus:
      base-url: ${PROMETHEUS_BASE_URL:http://prometheus:9090}
      timeout: 10s
      provider-id: local-prometheus
      metric-selectors:
        - http_server_requests_seconds_count
        - http_server_requests_seconds_sum
        - http_server_requests_seconds_max
        - http_client_requests_seconds_count
        - http_client_requests_seconds_sum
        - hikaricp_connections_active
        - hikaricp_connections_pending
        - hikaricp_connections_timeout_total
        - jvm_memory_used_bytes
        - process_cpu_usage

    tempo:
      base-url: ${TEMPO_BASE_URL:http://tempo:3200}
      timeout: 10s
      provider-id: local-tempo
      search-limit: 20

    health:
      timeout: 5s
      provider-id: local-actuator
      endpoints:
        blast-radius-api: ${BLAST_RADIUS_API_URL:http://blast-radius-api:8080}
        payment-service:  ${PAYMENT_SERVICE_URL:http://payment-service:8081}
        customer-service: ${CUSTOMER_SERVICE_URL:http://customer-service:8082}
        document-service: ${DOCUMENT_SERVICE_URL:http://document-service:8083}

  ai:
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:20}
