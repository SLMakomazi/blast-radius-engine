# Test application configuration.
# Overrides the main application.yml for Spring context tests.
# Points all provider URLs at localhost so no DNS resolution for lab hostnames
# is attempted during context loading or unit tests.
# No real connections are made — adapter beans construct a RestClient.Builder
# lazily with base URLs but do not establish connections at startup.

spring:
  application:
    name: blast-radius-api-test
  # Unit/context tests do not require the external incident store. Database and
  # Flyway integration are verified against blast-radius-db in the Docker lab.
  # Spring Boot 4's Flyway starter participates in the context before the
  # previous autoconfigure exclusion can keep this test database-free. Give
  # context tests an in-memory datasource instead; production still uses
  # blast-radius-db through the main application.yml.
  datasource:
    url: jdbc:h2:mem:blast_radius_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

blast-radius:
  lifecycle:
    auto-recovery-enabled: false
  topology:
    application-id: document-platform
    refresh-enabled: false
  telemetry:
    loki:
      base-url: http://localhost:3100
      provider-id: local-loki

    prometheus:
      base-url: http://localhost:9090
      provider-id: local-prometheus

    tempo:
      base-url: http://localhost:3200
      provider-id: local-tempo

    health:
      provider-id: local-actuator
      endpoints:
        blast-radius-api: http://localhost:8080
        payment-service:  http://localhost:8081
        customer-service: http://localhost:8082
        document-service: http://localhost:8083
