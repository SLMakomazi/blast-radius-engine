name: Validate outage evidence lifecycle

on:
  push:
    branches:
      - feat/outage-evidence-lifecycle
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Spring Boot Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: blast_radius_ci
          POSTGRES_USER: blast_radius_ci
          POSTGRES_PASSWORD: ci-integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blast_radius_ci -d blast_radius_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI_PG_URL: jdbc:postgresql://127.0.0.1:5432/blast_radius_ci
      CI_PG_USER: blast_radius_ci
      CI_PG_PASSWORD: ci-integration-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: blast-radius-api/pom.xml
      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress -f blast-radius-api/pom.xml clean verify

  frontend:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend regression tests
        run: node --test frontend/src/incident-visuals.test.js
      - name: Build frontend
        run: npm --prefix frontend run build
