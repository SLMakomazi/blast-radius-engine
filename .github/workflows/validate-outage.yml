name: Validate outage evidence lifecycle

on:
  push:
    branches:
      - feat/outage-evidence-lifecycle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Spring Boot Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: blast-radius-api/pom.xml
      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress -f blast-radius-api/pom.xml clean verify

  frontend:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend regression tests
        run: node --test frontend/src/incident-visuals.test.js
      - name: Build frontend
        run: npm --prefix frontend run build
