services:
  postgres-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  backend-api:
    build:
      context: ./blast-radius-api
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MONITOR_APPLICATION_ID: ${MONITOR_APPLICATION_ID:?Set MONITOR_APPLICATION_ID}
      MONITOR_ENVIRONMENT: ${MONITOR_ENVIRONMENT:?Set MONITOR_ENVIRONMENT}
      TOPOLOGY_REFRESH_ENABLED: ${TOPOLOGY_REFRESH_ENABLED:-false}

  frontend-ui:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend-api

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME_NAME:?Set POSTGRES_VOLUME_NAME}
