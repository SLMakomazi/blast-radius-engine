server:
  http_listen_port: 3200
  grpc_server_max_recv_msg_size: 4194304
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 1h
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
querier:
  max_concurrent_queries: 2
usage_report:
  reporting_enabled: false
