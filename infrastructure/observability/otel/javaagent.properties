# Standard W3C propagation; correlation IDs stay an independent application header.
otel.propagators=tracecontext
otel.resource.attributes=deployment.environment.name=local
# Direct Micrometer scraping is the single metrics path.
otel.metrics.exporter=none
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.endpoint=http://otel-collector:4318
otel.exporter.otlp.timeout=1000
otel.traces.sampler=always_on
otel.bsp.max.queue.size=1024
otel.bsp.max.export.batch.size=128
otel.bsp.schedule.delay=1000
otel.blrp.max.queue.size=1024
otel.blrp.max.export.batch.size=128
otel.blrp.schedule.delay=1000
otel.instrumentation.jdbc-datasource.enabled=true
otel.instrumentation.jdbc.statement-sanitizer.enabled=true
otel.instrumentation.jdbc.experimental.capture-query-parameters=false
otel.instrumentation.logback-appender.experimental.capture-mdc-attributes=correlationId
otel.instrumentation.logback-appender.experimental.capture-code-attributes=false
otel.instrumentation.logback-appender.experimental.capture-logstash-structured-arguments=false
# No HTTP headers/bodies, baggage, environment variables or query parameters are opted in.
