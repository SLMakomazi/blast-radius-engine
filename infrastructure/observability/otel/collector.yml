receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  filter/application_logs:
    error_mode: propagate
    logs:
      log_record:
        - 'not IsMatch(instrumentation_scope.name, "^com[.]madlanga[.]lab[.]")'
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - 'keep_keys(resource.attributes, ["service.name", "deployment.environment.name"])'
      - context: span
        statements:
          - 'keep_keys(span.attributes, ["http.request.method", "http.response.status_code", "http.route", "server.address", "server.port", "db.system", "db.system.name", "db.operation", "db.operation.name", "db.namespace", "error.type", "network.protocol.version"])'
          - 'set(span.status.message, "")'
      - context: spanevent
        statements:
          - 'keep_keys(spanevent.attributes, ["exception.type"])'
    log_statements:
      - context: resource
        statements:
          - 'keep_keys(resource.attributes, ["service.name", "deployment.environment.name"])'
      - context: log
        statements:
          - 'set(log.attributes["correlation_id"], log.attributes["correlationId"]) where log.attributes["correlationId"] != nil'
          - 'keep_keys(log.attributes, ["correlation_id"])'
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    timeout: 2s
    sending_queue:
      queue_size: 128
      num_consumers: 2
    retry_on_failure:
      max_elapsed_time: 30s
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    timeout: 2s
    sending_queue:
      queue_size: 128
      num_consumers: 2
    retry_on_failure:
      max_elapsed_time: 30s
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_http/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/application_logs, transform/privacy, batch]
      exporters: [otlp_http/loki]
