global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
scrape_configs:
  - job_name: applications
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [blast-radius-api:8080, payment-service:8081, customer-service:8082, document-service:8083]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
