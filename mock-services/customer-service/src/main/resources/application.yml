spring:
  application:
    name: customer-service
server:
  port: 8082
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      service: ${spring.application.name}
      environment: local
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
logging:
  pattern:
    level: "%5p [service_name=${spring.application.name} correlationId=%X{correlationId:-} trace_id=%X{trace_id:-} span_id=%X{span_id:-}]"
lab:
  downstream-url: ${DOCUMENT_SERVICE_URL:http://document-service:8083}
  connect-timeout: ${HTTP_CONNECT_TIMEOUT:2s}
  read-timeout: ${HTTP_READ_TIMEOUT:8s}
